<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Employee Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body style="display: flex; justify-content: center; align-items: center; height: 100vh;">

    <div class="spine-section" style="width: 100%; max-width: 400px; padding: 3rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Employee Portal</h1>
            <p style="font-size: 0.9rem;">Authenticated Access Only</p>
        </div>

        <form id="login-form" style="display: flex; flex-direction: column; gap: 1.5rem;">
            <div class="form-group">
                <label for="email"
                    style="display: block; font-size: 0.8rem; margin-bottom: 0.5rem; color: var(--text-tertiary);">EMAIL</label>
                <input type="email" id="email" placeholder="admin@company.com" required style="width: 100%;">
            </div>
            <div class="form-group">
                <label for="password"
                    style="display: block; font-size: 0.8rem; margin-bottom: 0.5rem; color: var(--text-tertiary);">PASSWORD</label>
                <input type="password" id="password" placeholder="********" required style="width: 100%;">
            </div>
            <button type="submit" class="btn-primary"
                style="width: 100%; justify-content: center; margin-top: 1rem;">INITIATE SESSION</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize Supabase if not already done
            if (typeof initSupabase === 'function') {
                initSupabase();
            }

            const loginForm = document.getElementById('login-form');
            const submitBtn = loginForm.querySelector('button[type="submit"]');

            // Optional: Error message container
            const errorDiv = document.createElement('div');
            errorDiv.style.cssText = 'color: #ef4444; font-size: 0.85rem; text-align: center; margin-top: 1rem; display: none;';
            loginForm.appendChild(errorDiv);

            if (loginForm) {
                loginForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const email = document.getElementById('email').value;
                    const password = document.getElementById('password').value;

                    if (!email || !password) return;

                    submitBtn.textContent = 'AUTHENTICATING...';
                    submitBtn.style.opacity = '0.7';
                    submitBtn.disabled = true;
                    errorDiv.style.display = 'none';

                    try {
                        const { data, error } = await _sb.auth.signInWithPassword({
                            email: email,
                            password: password
                        });

                        if (error) throw error;

                        // Success, redirect to portal
                        window.location.href = 'portal.html';
                    } catch (err) {
                        console.error('Login error:', err.message);
                        errorDiv.textContent = err.message || 'Invalid login credentials.';
                        errorDiv.style.display = 'block';
                        submitBtn.textContent = 'INITIATE SESSION';
                        submitBtn.style.opacity = '1';
                        submitBtn.disabled = false;
                    }
                });
            }
        });
    </script>
</body>
</html>
