[build]
  # Tell Netlify not to fail the build when it finds these specific keys
  # in the client-side code, as Supabase anon keys and URLs are meant to be public.
  
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true
