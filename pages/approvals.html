<!-- ============================================================
     APPROVALS PAGE — pages/approvals.html
     Loaded into #view-container in portal.html via fetch().
     All interactivity handled by renderApprovals() in app.js.
============================================================ -->

<header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
    <h2 style="margin:0;">Approvals</h2>
    <div style="font-size:0.85rem; color:var(--text-tertiary);">Review AI Extractions</div>
</header>

<p style="font-size:0.9rem; color:var(--text-secondary); margin-bottom:1.5rem;">AI proposals awaiting your review</p>

<!-- View Tabs -->
<div style="display:flex; border-bottom:2px solid var(--border-subtle); margin-bottom:2rem; gap:0;">
    <button class="appr-tab active" data-tab="ai" onclick="window.switchApprovalTab('ai', this)"
        style="background:none; border:none; border-bottom:2px solid var(--energy-algae); margin-bottom:-2px; padding:0.6rem 1.4rem; font-family:inherit; font-size:0.9rem; font-weight:600; color:var(--text-primary); cursor:pointer; transition:all 0.2s;">
        <span class="material-symbols-outlined" style="font-size:1rem; vertical-align:middle; margin-right:0.3rem;">smart_toy</span>
        AI Prompts
    </button>
    <button class="appr-tab" data-tab="user" onclick="window.switchApprovalTab('user', this)"
        style="background:none; border:none; border-bottom:2px solid transparent; margin-bottom:-2px; padding:0.6rem 1.4rem; font-family:inherit; font-size:0.9rem; font-weight:500; color:var(--text-tertiary); cursor:pointer; transition:all 0.2s;">
        <span class="material-symbols-outlined" style="font-size:1rem; vertical-align:middle; margin-right:0.3rem;">person</span>
        User Prompts
    </button>
</div>

<!-- AI Prompts Tab Content -->
<div id="appr-view-ai">
    <div id="approvals-list-container" style="display:flex; flex-direction:column; gap:1rem;">
        <!-- Populated by renderApprovals() -->
        <div style="display:flex; align-items:center; justify-content:center; padding:3rem; color:var(--text-tertiary);">
            Loading pending approvals...
        </div>
    </div>
</div>

<!-- User Prompts Tab Content -->
<div id="appr-view-user" style="display:none;">
    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4rem 2rem; background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:14px;">
        <span class="material-symbols-outlined" style="font-size:3rem; color:var(--text-tertiary); margin-bottom:1rem; opacity:0.5;">task_alt</span>
        <p style="font-size:1.1rem; font-weight:600; color:var(--text-primary); margin:0 0 0.5rem 0;">You're all caught up</p>
        <p style="font-size:0.9rem; color:var(--text-tertiary); margin:0;">No pending user prompts to review at the moment.</p>
    </div>
</div>

<style>
.approval-card { background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:10px; padding:1.25rem; transition:box-shadow 0.2s, transform 0.15s; }
.approval-card:hover { box-shadow:0 4px 16px rgba(0,0,0,0.08); transform:translateY(-1px); }
.approval-badge { display:inline-block; font-size:0.7rem; font-weight:600; padding:0.2rem 0.6rem; border-radius:100px; border:1px solid; background:rgba(96,165,250,0.15); color:#3b82f6; border-color:#60a5fa;}
.approval-field { margin-bottom:0.75rem; }
.approval-field label { display:block; font-size:0.75rem; color:var(--text-tertiary); margin-bottom:0.25rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; }
.approval-field input, .approval-field textarea { width:100%; padding:0.5rem 0.75rem; border:1px solid var(--border-subtle); background:var(--bg-app); color:var(--text-primary); border-radius:6px; font-family:inherit; font-size:0.875rem; resize:vertical; }
.approval-field input:focus, .approval-field textarea:focus { outline:none; border-color:var(--energy-algae); }
.json-view { background:var(--bg-app); border:1px solid var(--border-subtle); border-radius:6px; padding:0.75rem; font-family:monospace; font-size:0.8rem; overflow-x:auto; white-space:pre-wrap; }
</style>
