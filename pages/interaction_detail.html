<!-- ============================================================
     INTERACTION DETAIL PAGE — pages/interaction_detail.html
     View + inline edit mode.  Renderer: renderInteractionDetail() in app.js
============================================================ -->

<!-- ── HEADER ─────────────────────────────────────────────── -->
<div style="margin-bottom: 2rem; display: flex; align-items: flex-start; justify-content: space-between;">
    <div>
        <button class="btn-secondary" onclick="loadView('interactions')" style="height: 32px; padding: 0 0.75rem; font-size: 0.8rem; margin-bottom: 1rem;">← Back to Update Log</button>
        <h1 id="detail-int-title" style="margin-bottom: 0.5rem; font-size: 2rem;">Interaction Detail</h1>
        <div style="font-size: 0.9rem; color: var(--text-secondary); display: flex; align-items: center; gap: 0.5rem;">
            <span>Date:</span> <span id="detail-int-date" style="font-weight: 600;">-</span> 
            <span id="detail-int-status" style="color: #ef4444; font-weight: 600;">Upcoming</span>
        </div>
    </div>
    <div style="display:flex; align-items:center; gap:0.5rem; margin-top:2.5rem;">
        <button id="int-cancel-btn" class="btn-secondary" style="display:none; align-items:center; gap:0.4rem;" onclick="window.cancelInteractionEdit()">
            <span class="material-symbols-outlined" style="font-size:1rem;">close</span> Cancel
        </button>
        <button id="int-edit-toggle-btn" class="btn-primary" style="display:inline-flex;align-items:center;gap:0.4rem;" onclick="window.toggleInteractionEdit()">
            <span class="material-symbols-outlined" style="font-size:1rem;">edit</span> Edit
        </button>
    </div>
</div>

<!-- ══════════════════════════════════════════════════════════
     VIEW MODE
═══════════════════════════════════════════════════════════ -->
<div id="int-view-mode">
    <div class="card" style="margin-bottom: 1.5rem; padding: 1.5rem; border: 1px solid var(--border-subtle); border-radius: 8px;">
        <div id="detail-int-description" style="font-size: 0.95rem; line-height: 1.6; color: var(--text-primary);">
            <!-- Populated by JS -->
        </div>
    </div>

    <div style="display: flex; gap: 1rem; align-items: flex-start; margin-bottom: 1.5rem;">
        <div style="width: 100px; color: var(--text-tertiary); font-size: 0.9rem; padding-top: 0.5rem;">Attendees:</div>
        <div id="detail-int-attendees" style="flex: 1; display: flex; gap: 0.5rem; flex-wrap: wrap;">
            <!-- Populated by JS -->
        </div>
    </div>

    <div style="display: flex; gap: 1rem; align-items: flex-start; margin-bottom: 1.5rem;">
        <div style="width: 100px; color: var(--text-tertiary); font-size: 0.9rem; padding-top: 0.5rem;">Agenda:</div>
        <div style="flex: 1;">
            <div class="card" style="border: 1px solid var(--border-subtle); border-radius: 8px; padding: 1rem; position: relative;">
                <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem;">
                    <span class="interaction-pill" style="background: rgba(0,0,0,0.05); border: none;">
                        <span class="material-symbols-outlined" style="font-size: 1rem;">chat</span> Discuss
                    </span>
                    <select id="detail-int-agenda-objective" style="flex: 1; border: 1px solid var(--border-subtle); border-radius: 4px; padding: 0.5rem; font-family: 'Inter', sans-serif;" disabled>
                        <option value="">objective / action</option>
                    </select>
                </div>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <div style="width: 60px; font-weight: 600; font-size: 0.9rem;">Details:</div>
                    <div id="detail-int-agenda-details-text" style="flex: 1; font-size: 0.9rem; color: var(--text-primary);">Talk / talked about the meeting with [person] and the blockages in the project.</div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ══════════════════════════════════════════════════════════
     EDIT MODE (inline — hidden by default)
═══════════════════════════════════════════════════════════ -->
<div id="int-edit-mode" style="display: none;">
    <style>
        .update-type-btn { border:1px solid var(--border-subtle); background:#fff; padding:0.5rem 1rem; border-radius:8px; display:inline-flex; align-items:center; gap:0.5rem; cursor:pointer; font-size:0.9rem; transition:all 0.2s; color:var(--text-secondary); }
        .update-type-btn:hover { background:var(--bg-app); }
        .update-type-btn.active { background:#ecfdf5; color:#10b981; border-color:#10b981; font-weight:600; }
    </style>

    <div style="margin-bottom: 1.5rem;">
        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: #6b7280;">Purpose:</label>
        <input type="text" id="edit-int-purpose" style="border: 1px solid var(--border-subtle); border-radius: 6px; background: #fff; width: 100%; padding: 0.5rem; font-size:1.1rem; font-weight:600; font-family: 'Inter', sans-serif;">
    </div>

    <div style="margin-bottom: 1.5rem;">
        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: #6b7280;">Description:</label>
        <textarea id="edit-int-description" rows="3" style="border: 1px solid var(--border-subtle); border-radius: 6px; background: #fff; resize: vertical; width: 100%; padding: 0.5rem; font-family: 'Inter', sans-serif; font-size:0.95rem;"></textarea>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; margin-bottom: 1.5rem;">
        <div>
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: #6b7280;">Date:</label>
            <input type="date" id="edit-int-date" style="border: 1px solid var(--border-subtle); border-radius: 6px; background: #fff; width: 100%; padding: 0.5rem; font-family: 'Inter', sans-serif;">
        </div>
        <div>
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: #6b7280;">Update Type:</label>
            <div id="edit-int-type-group" style="display: flex; gap: 0.5rem; flex-wrap:wrap;">
                <button class="update-type-btn" onclick="this.classList.toggle('active')" data-val="Phone"><span class="material-symbols-outlined" style="font-size:1.1rem;">call</span> Phone</button>
                <button class="update-type-btn" onclick="this.classList.toggle('active')" data-val="Email"><span class="material-symbols-outlined" style="font-size:1.1rem;">mail</span> Email</button>
                <button class="update-type-btn" onclick="this.classList.toggle('active')" data-val="In-Person"><span class="material-symbols-outlined" style="font-size:1.1rem;">groups</span> In-Person</button>
                <button class="update-type-btn" onclick="this.classList.toggle('active')" data-val="Video"><span class="material-symbols-outlined" style="font-size:1.1rem;">videocam</span> Video</button>
                <button class="update-type-btn" onclick="this.classList.toggle('active')" data-val="Other"><span class="material-symbols-outlined" style="font-size:1.1rem;">more_horiz</span> Other</button>
            </div>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 1.5rem; align-items: start;">
        <div>
            <label style="font-weight: 500; margin-bottom: 0.5rem; display:block; color: #6b7280;">Outcome (1-10): <span id="edit-int-outcome-val" style="font-weight:bold;color:var(--text-primary);">5</span></label>
            <input type="range" id="edit-int-outcome-slider" min="1" max="10" step="1" value="5" style="width: 100%; accent-color:#22c55e;" oninput="document.getElementById('edit-int-outcome-val').innerText = this.value">
        </div>
        <div>
            <label style="font-weight: 500; margin-bottom: 0.5rem; display:block; color: #6b7280;">Outcome Notes (private):</label>
            <textarea id="edit-int-outcome-notes" placeholder="Elaborate on outcome / how it went" rows="2" style="border: 1px solid var(--border-subtle); border-radius: 6px; background: #fff; width: 100%; padding: 0.5rem; font-family: 'Inter', sans-serif; resize:vertical;"></textarea>
        </div>
    </div>

    <div style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem;">
        <label style="font-weight: 500; margin: 0; color: #6b7280;">Attendees:</label>
        <button style="width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border-subtle); background: #f3f4f6; cursor: pointer; display: flex; align-items: center; justify-content: center;">+</button>
        <div id="edit-int-attendees-list" style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
            <!-- Populated by JS -->
        </div>
    </div>

    <div style="margin-bottom: 1.5rem; display: flex; align-items: flex-start; gap: 1rem;">
        <label style="font-weight: 500; margin-top: 0.5rem; color: #6b7280;">Agenda:</label>
        <button style="width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border-subtle); background: #f3f4f6; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-top: 0.25rem;" onclick="window.addAgendaItem()">+</button>
        
        <div id="edit-int-agenda-container" style="flex: 1; display: flex; flex-direction: column; gap: 1rem;">
            <!-- Populated dynamically by app.js -->
        </div>
    </div>

    <div style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem;">
        <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; margin-bottom: 0;">
            <input type="checkbox"> Follow-up Date / Schedule next interaction
        </label>
    </div>

    <div style="margin-bottom: 2rem; font-size: 0.9rem; color: var(--text-secondary); display: flex; gap: 1rem; align-items: center;">
        Privacy: 
        <span style="display: flex; align-items: center; gap: 0.25rem; color: #3b82f6;"><span class="material-symbols-outlined" style="font-size: 1rem;">language</span> Public/Official</span>
        <span style="display: flex; align-items: center; gap: 0.25rem;"><span class="material-symbols-outlined" style="font-size: 1rem;">groups</span> Attendees</span>
        <span style="display: flex; align-items: center; gap: 0.25rem;"><span class="material-symbols-outlined" style="font-size: 1rem;">lock</span> Restricted</span>
        <span style="display: flex; align-items: center; gap: 0.25rem;"><b>+</b> Advanced / Custom</span>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 1rem; border-top: 1px solid var(--border-subtle); padding-top: 1.5rem;">
        <button class="btn-primary" style="background: #374151; height: 44px; padding: 0 2rem;" onclick="window.saveInteraction()">Save Updates</button>
    </div>

</div>
<!-- /EDIT MODE -->


<style>
.int-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
}
</style>
