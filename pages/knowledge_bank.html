<header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
    <h2 style="margin:0;">Messaging &amp; Q&amp;As</h2>
    <div style="display:flex;gap:0.5rem;align-items:center;">
        <button id="msg-cancel-btn" class="btn-secondary" style="display:none;align-items:center;gap:0.25rem;">
            <span class="material-symbols-outlined" style="font-size:1rem;">close</span> Cancel
        </button>
        <button id="msg-edit-toggle" class="btn-secondary" style="display:flex; align-items:center; gap:0.25rem;">
            <span class="material-symbols-outlined" style="font-size:1rem;">edit</span> Edit
        </button>
    </div>
</header>

<div id="messaging-cards-container">
    <!-- Rendered dynamically from tbl_content_card page 2 -->
    <div style="padding:3rem; text-align:center; color:var(--text-tertiary);">
        <span class="material-symbols-outlined" style="font-size:2rem; animation:spin 1s linear infinite;">autorenew</span>
        <p style="margin-top:0.5rem;">Loading messaging cards...</p>
    </div>
</div>
