<header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
    <h2 style="margin:0;">Stakeholders</h2>
    <div style="display:flex; gap:0.5rem; align-items:center;">
        <button class="btn-secondary" onclick="loadView('contacts'); history.pushState(null, '', '#contacts')">Contacts</button>
        <button class="btn-primary" style="border:none; color:white;" onclick="window.viewStakeholderEdit(null)">+ Add Stakeholder</button>
    </div>
</header>

<!-- Search and Filters Bar -->
<div class="spine-section" style="padding: 1rem; margin-bottom: 1.5rem; display: flex; gap: 0.75rem; align-items: center; flex-wrap:wrap;">
    <div style="position:relative;">
        <span class="material-symbols-outlined" style="position:absolute; left:0.6rem; top:50%; transform:translateY(-50%); font-size:1rem; color:var(--text-tertiary); pointer-events:none;">search</span>
        <input type="text" id="stakeholder-search" placeholder="Search stakeholders..." oninput="window.filterStakeholders()"
            style="width: 200px; padding:0.45rem 0.75rem 0.45rem 2rem; border:1px solid var(--border-subtle); background:rgba(0,0,0,0.02); color:var(--text-primary); border-radius:20px; font-size:0.82rem; outline:none; transition:border-color 0.2s;" onfocus="this.style.borderColor='var(--energy-algae)'" onblur="this.style.borderColor='var(--border-subtle)'">
    </div>

    <div class="custom-filter-mega" style="position:relative; display:inline-block;">
        <button id="stakeholder-mega-trigger" onclick="window.toggleMegaMenu('stakeholder-mega-menu')" style="background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:20px; padding:0.4rem 1rem; font-size:0.85rem; font-weight:500; color:var(--text-secondary); cursor:pointer; display:flex; align-items:center; gap:0.4rem; transition:all 0.2s;" onmouseover="this.style.borderColor='var(--energy-algae)';this.style.color='var(--text-primary)'" onmouseout="if(!this.classList.contains('active')) { this.style.borderColor='var(--border-subtle)';this.style.color='var(--text-secondary)'; }">
            <span class="material-symbols-outlined" style="font-size:1.2rem;">filter_list</span> Filters <span id="stakeholder-filter-count" style="display:none;background:var(--energy-algae);color:#fff;border-radius:10px;padding:0.1rem 0.4rem;font-size:0.7rem;font-weight:700;">0</span>
        </button>
        <div id="stakeholder-mega-menu" class="mega-menu-dropdown" style="display:none; position:absolute; top:100%; left:0; margin-top:0.5rem; background:var(--bg-app); border:1px solid var(--border-subtle); border-radius:12px; padding:1.5rem; min-width:380px; z-index:100; box-shadow:0 8px 24px rgba(0,0,0,0.12);">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem;">
                
                <div class="mega-menu-group" id="stakeholder-filter-status" data-on-change="filterStakeholders">
                    <h4 style="margin:0 0 0.5rem 0; font-size:0.85rem; color:var(--text-primary); border-bottom:1px solid var(--border-subtle); padding-bottom:0.25rem;">Status</h4>
                    <label style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.4rem; font-size:0.82rem; cursor:pointer; color:var(--text-secondary);"><input type="checkbox" value="" checked> All</label>
                    <label style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.4rem; font-size:0.82rem; cursor:pointer; color:var(--text-secondary);"><input type="checkbox" value="Critical/At Risk"> Critical / At Risk</label>
                    <label style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.4rem; font-size:0.82rem; cursor:pointer; color:var(--text-secondary);"><input type="checkbox" value="Strained"> Strained</label>
                    <label style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.4rem; font-size:0.82rem; cursor:pointer; color:var(--text-secondary);"><input type="checkbox" value="Friction Points"> Friction Points</label>
                    <label style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.4rem; font-size:0.82rem; cursor:pointer; color:var(--text-secondary);"><input type="checkbox" value="Operational"> Operational</label>
                    <label style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.4rem; font-size:0.82rem; cursor:pointer; color:var(--text-secondary);"><input type="checkbox" value="Stable"> Stable</label>
                    <label style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.4rem; font-size:0.82rem; cursor:pointer; color:var(--text-secondary);"><input type="checkbox" value="Dormant"> Dormant</label>
                </div>
                
                <div class="mega-menu-group" id="stakeholder-filter-role" data-on-change="filterStakeholders">
                    <h4 style="margin:0 0 0.5rem 0; font-size:0.85rem; color:var(--text-primary); border-bottom:1px solid var(--border-subtle); padding-bottom:0.25rem;">Role</h4>
                    <label style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.4rem; font-size:0.82rem; cursor:pointer; color:var(--text-secondary);"><input type="checkbox" value="" checked> All</label>
                    <!-- Populated dynamically -->
                </div>
            </div>
            
            <div style="display:flex; justify-content:flex-end; margin-top:1.5rem; padding-top:1rem; border-top:1px solid var(--border-subtle); gap:0.5rem;">
                <button class="btn-secondary" onclick="window.clearStakeholdersFilters()" style="padding:0.3rem 0.8rem; font-size:0.8rem;">Clear All</button>
                <button class="btn-primary" onclick="window.toggleMegaMenu('stakeholder-mega-menu')" style="padding:0.3rem 0.8rem; font-size:0.8rem;">Apply</button>
            </div>
        </div>
    </div>

    <div style="margin-left:auto; display:flex; align-items:center;">
        <div class="custom-sort-pill" style="display:flex; align-items:center; border:1px solid var(--border-subtle); border-radius:20px; background:var(--bg-surface); padding:0.15rem; transition:border-color 0.2s;" onmouseover="this.style.borderColor='var(--energy-algae)'" onmouseout="this.style.borderColor='var(--border-subtle)'">
            <select id="stakeholder-sort" onchange="window.filterStakeholders()" style="background:transparent; border:none; padding:0.25rem 0.5rem; font-size:0.82rem; color:var(--text-secondary); cursor:pointer; outline:none; border-right:1px solid var(--border-subtle);">
                <option value="name">Sort: Name (A-Z)</option>
                <option value="status">Sort: Status</option>
                <option value="role">Sort: Role</option>
            </select>
            <button id="stakeholder-sort-dir" data-dir="asc" onclick="window.toggleSortDirection('stakeholder-sort-dir', 'filterStakeholders')" style="background:transparent; border:none; color:var(--text-secondary); padding:0 0.4rem; cursor:pointer; font-size:1.2rem; display:flex; align-items:center; outline:none;" class="material-symbols-outlined">
                arrow_upward
            </button>
        </div>
    </div>
</div>

<!-- Quick Filters -->
<div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:2rem; flex-wrap:wrap; font-size:0.8rem;">
    <span style="font-weight:600; color:var(--text-secondary);">Quick Filters:</span>
    <span class="quick-filter-pill" onclick="document.getElementById('stakeholder-search').value='At Risk'; window.filterStakeholders();" style="background:var(--bg-surface); border:1px solid var(--border-subtle); padding:0.2rem 0.5rem; border-radius:4px; cursor:pointer; transition:all 0.2s;" onmouseover="this.style.background='rgba(0,0,0,0.05)'" onmouseout="this.style.background='var(--bg-surface)'">🔍 Needs Attention</span>
    <span class="quick-filter-pill" onclick="document.getElementById('stakeholder-search').value='Primary Partner'; window.filterStakeholders();" style="background:var(--bg-surface); border:1px solid var(--border-subtle); padding:0.2rem 0.5rem; border-radius:4px; cursor:pointer; transition:all 0.2s;" onmouseover="this.style.background='rgba(0,0,0,0.05)'" onmouseout="this.style.background='var(--bg-surface)'">🔍 Primary Partner</span>
    <span class="quick-filter-pill" onclick="document.getElementById('stakeholder-search').value='High Interest'; window.filterStakeholders();" style="background:var(--bg-surface); border:1px solid var(--border-subtle); padding:0.2rem 0.5rem; border-radius:4px; cursor:pointer; transition:all 0.2s;" onmouseover="this.style.background='rgba(0,0,0,0.05)'" onmouseout="this.style.background='var(--bg-surface)'">🔍 High Interest</span>
    <span class="quick-filter-pill" onclick="document.getElementById('stakeholder-search').value='Supply Chain'; window.filterStakeholders();" style="background:var(--bg-surface); border:1px solid var(--border-subtle); padding:0.2rem 0.5rem; border-radius:4px; cursor:pointer; transition:all 0.2s;" onmouseover="this.style.background='rgba(0,0,0,0.05)'" onmouseout="this.style.background='var(--bg-surface)'">🔍 Supply Chain</span>
    <span class="quick-filter-pill" onclick="document.getElementById('stakeholder-search').value=''; window.clearStakeholdersFilters();" style="background:var(--bg-surface); border:1px solid var(--border-subtle); padding:0.2rem 0.5rem; border-radius:4px; cursor:pointer; transition:all 0.2s;" onmouseover="this.style.background='rgba(0,0,0,0.05)'" onmouseout="this.style.background='var(--bg-surface)'">✕ Clear</span>
</div>

<div id="stakeholder-list" style="display:flex; flex-direction:column; gap:0.5rem;">
    <!-- Populated by JS -->
</div>
